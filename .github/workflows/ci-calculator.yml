name: Java CI with Maven

# Trigger: run on push to main and on pull requests targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Runner environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: setup JDK 17 (matches local development environment)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: cache Maven dependencies to speed up repeated builds
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: compile all Java source files
      - name: Compile source code
        run: mvn clean compile

      # Step 5: run all JUnit 5 tests from Lab 4
      - name: Run unit tests
        run: mvn test